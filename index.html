const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.onsubmit=async e=>{

  const pw=document.getElementById('pw').value;
  try{const h=await open_(pw);try{document.getElementById('rem').checked?localStorage.setItem(K,pw):localStorage.removeItem(K)}catch(x){}show(h);}
  catch(x){err.textContent='סיסמה שגויה';go.disabled=false;go.textContent='כניסה';}
};
let saved=null;try{saved=localStorage.getItem(K)}catch(x){}
if(saved)open_(saved).then(show).catch(()=>{try{localStorage.removeItem(K)}catch(x){}});
}
